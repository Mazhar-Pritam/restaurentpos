<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>New purchase · Restaurant POS</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet"></head>
<body data-page="purchases/index.html" data-root="../">
<div id="app-sidebar"></div><div class="main"><div id="app-topbar"></div>
<main class="content">
<div class="page-head"><div><h1>New purchase</h1><nav aria-label="breadcrumb"><ol class="breadcrumb small mb-0"><li class="breadcrumb-item">Purchasing</li><li class="breadcrumb-item active">New purchase</li></ol></nav></div><div class="d-flex flex-wrap gap-2"></div></div>
<div class="card-x mb-3"><div class="card-h">Order details</div><div class="card-b"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="supplier">Supplier</label><select class="form-select" id="supplier"><option>Dhaka Fresh Meats</option><option>Bakers Choice</option><option>Dairy Direct</option><option>Beverage Hub</option><option>Green Basket</option></select></div><div class="col-md-6"><label class="form-label" for="order-date">Order date</label><input class="form-control" type="date" id="order-date" value="" placeholder=""></div><div class="col-md-6"><label class="form-label" for="supplier-invoice-no.">Supplier invoice no.</label><input class="form-control" type="text" id="supplier-invoice-no." value="" placeholder=""></div><div class="col-md-6"><label class="form-label" for="payment-status">Payment status</label><select class="form-select" id="payment-status"><option>Unpaid</option><option>Part paid</option><option>Paid</option></select></div></div></div></div><div class="card-x mb-3"><div class="card-h">Items<a class="btn btn-sm btn-light border" href="#">Add line</a></div><div class="card-b"><table class="table table-x mb-0"><thead><tr><th>Ingredient</th><th>Qty</th><th>Unit cost</th><th class="text-end">Total</th></tr></thead><tbody><tr data-row><td><select class="form-select form-select-sm"><option selected>Beef patty</option><option >Chicken fillet</option><option >Burger bun</option><option >Mozzarella</option><option >Pizza dough</option><option >Tomato sauce</option><option >Lime</option><option >Cooking oil</option><option >Cola can</option><option >Bottled water</option></select></td><td><input class="form-control form-control-sm qty" type="number" value="100"></td><td><input class="form-control form-control-sm cost" type="number" step="0.01" value="85"></td><td class="line text-end"></td></tr><tr data-row><td><select class="form-select form-select-sm"><option >Beef patty</option><option >Chicken fillet</option><option selected>Burger bun</option><option >Mozzarella</option><option >Pizza dough</option><option >Tomato sauce</option><option >Lime</option><option >Cooking oil</option><option >Cola can</option><option >Bottled water</option></select></td><td><input class="form-control form-control-sm qty" type="number" value="200"></td><td><input class="form-control form-control-sm cost" type="number" step="0.01" value="12"></td><td class="line text-end"></td></tr><tr data-row><td><select class="form-select form-select-sm"><option >Beef patty</option><option >Chicken fillet</option><option >Burger bun</option><option selected>Mozzarella</option><option >Pizza dough</option><option >Tomato sauce</option><option >Lime</option><option >Cooking oil</option><option >Cola can</option><option >Bottled water</option></select></td><td><input class="form-control form-control-sm qty" type="number" value="10"></td><td><input class="form-control form-control-sm cost" type="number" step="0.01" value="720"></td><td class="line text-end"></td></tr></tbody><tfoot><tr><th colspan="3" class="text-end">Order total</th><th class="text-end" data-sum></th></tr></tfoot></table></div></div><div class="text-muted small mb-3">Stock increases only when goods are received, not when the order is saved.</div><div class="d-flex gap-2 justify-content-end mb-3"><a class="btn btn-light border" href="#">Cancel</a><button class="btn btn-accent">Save as draft</button></div>
</main><div id="app-footer"></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

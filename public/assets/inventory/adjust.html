<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock adjustment · Restaurant POS</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet"></head>
<body data-page="inventory/adjust.html" data-root="../">
<div id="app-sidebar"></div><div class="main"><div id="app-topbar"></div>
<main class="content">
<div class="page-head"><div><h1>Stock adjustment</h1><nav aria-label="breadcrumb"><ol class="breadcrumb small mb-0"><li class="breadcrumb-item">Inventory</li><li class="breadcrumb-item active">Stock adjustment</li></ol></nav></div><div class="d-flex flex-wrap gap-2"></div></div>
<div class="card-x mb-3"><div class="card-h">Adjustment</div><div class="card-b"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="date">Date</label><input class="form-control" type="date" id="date" value="" placeholder=""></div><div class="col-md-6"><label class="form-label" for="reason">Reason</label><select class="form-select" id="reason"><option>Physical count</option><option>Damage</option><option>Expired</option><option>Kitchen mistake</option><option>Other</option></select></div><div class="col-md-12"><label class="form-label" for="notes">Notes</label><textarea class="form-control" id="notes" rows="3" placeholder=""></textarea><div class="form-text">Adjustments never edit old stock records. They add a new traceable entry.</div></div></div></div></div><div class="card-x mb-3"><div class="card-h">Counted quantities</div><div class="card-b"><table class="table table-x mb-0"><thead><tr><th>Ingredient</th><th>System qty</th><th>Counted qty</th><th>Difference</th></tr></thead><tbody><tr data-row><td><select class="form-select form-select-sm"><option selected>Beef patty</option><option >Chicken fillet</option><option >Burger bun</option><option >Mozzarella</option><option >Pizza dough</option><option >Tomato sauce</option><option >Lime</option><option >Cooking oil</option><option >Cola can</option><option >Bottled water</option></select></td><td><input class="form-control form-control-sm sys" type="number" value="12" readonly></td><td><input class="form-control form-control-sm cnt" type="number" value="11" step="0.1"></td><td class="line"></td></tr><tr data-row><td><select class="form-select form-select-sm"><option >Beef patty</option><option >Chicken fillet</option><option >Burger bun</option><option selected>Mozzarella</option><option >Pizza dough</option><option >Tomato sauce</option><option >Lime</option><option >Cooking oil</option><option >Cola can</option><option >Bottled water</option></select></td><td><input class="form-control form-control-sm sys" type="number" value="1.8" readonly></td><td><input class="form-control form-control-sm cnt" type="number" value="1.8" step="0.1"></td><td class="line"></td></tr><tr data-row><td><select class="form-select form-select-sm"><option >Beef patty</option><option >Chicken fillet</option><option >Burger bun</option><option >Mozzarella</option><option >Pizza dough</option><option >Tomato sauce</option><option selected>Lime</option><option >Cooking oil</option><option >Cola can</option><option >Bottled water</option></select></td><td><input class="form-control form-control-sm sys" type="number" value="0.9" readonly></td><td><input class="form-control form-control-sm cnt" type="number" value="0.7" step="0.1"></td><td class="line"></td></tr></tbody></table></div></div><div class="d-flex gap-2 justify-content-end mb-3"><a class="btn btn-light border" href="#">Cancel</a><button class="btn btn-accent">Post adjustment</button></div>
</main><div id="app-footer"></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/theme.js"></script><script src="../assets/js/pages.js"></script></body></html>

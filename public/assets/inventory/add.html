<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add ingredient · Restaurant POS</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet"></head>
<body data-page="inventory/index.html" data-root="../">
<div id="app-sidebar"></div><div class="main"><div id="app-topbar"></div>
<main class="content">
<div class="page-head"><div><h1>Add ingredient</h1><nav aria-label="breadcrumb"><ol class="breadcrumb small mb-0"><li class="breadcrumb-item">Inventory</li><li class="breadcrumb-item active">Add ingredient</li></ol></nav></div><div class="d-flex flex-wrap gap-2"></div></div>
<div class="card-x mb-3"><div class="card-h">Ingredient details</div><div class="card-b"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="name">Name</label><input class="form-control" type="text" id="name" value="" placeholder=""></div><div class="col-md-6"><label class="form-label" for="category">Category</label><select class="form-select" id="category"><option>Meat</option><option>Dairy</option><option>Bakery</option><option>Produce</option><option>Pantry</option><option>Beverages</option></select></div><div class="col-md-6"><label class="form-label" for="stock-unit">Stock unit</label><select class="form-select" id="stock-unit"><option>g</option><option>kg</option><option>ml</option><option>l</option><option>pcs</option></select></div><div class="col-md-6"><label class="form-label" for="reorder-level">Reorder level</label><input class="form-control" type="number" id="reorder-level" value="" placeholder=""><div class="form-text">Low-stock alerts start below this.</div></div><div class="col-md-6"><label class="form-label" for="opening-stock">Opening stock</label><input class="form-control" type="number" id="opening-stock" value="0" placeholder=""><div class="form-text">Later changes are made through purchases and adjustments.</div></div><div class="col-md-6"><label class="form-label" for="storage">Storage</label><input class="form-control" type="text" id="storage" value="" placeholder=""></div><div class="col-md-12"><label class="form-label" for="notes">Notes</label><textarea class="form-control" id="notes" rows="3" placeholder=""></textarea></div></div></div></div><div class="d-flex gap-2 justify-content-end mb-3"><a class="btn btn-light border" href="#">Cancel</a><button class="btn btn-accent">Save ingredient</button></div>
</main><div id="app-footer"></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/theme.js"></script><script src="../assets/js/pages.js"></script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant settings · Restaurant POS</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet"></head>
<body data-page="settings/index.html" data-root="../">
<div id="app-sidebar"></div><div class="main"><div id="app-topbar"></div>
<main class="content">
<div class="page-head"><div><h1>Restaurant settings</h1><nav aria-label="breadcrumb"><ol class="breadcrumb small mb-0"><li class="breadcrumb-item">Admin</li><li class="breadcrumb-item active">Restaurant settings</li></ol></nav></div><div class="d-flex flex-wrap gap-2"></div></div>
<div class="card-x mb-3"><div class="card-h">Restaurant</div><div class="card-b"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="restaurant-name">Restaurant name</label><input class="form-control" type="text" id="restaurant-name" value="Demo Restaurant" placeholder=""></div><div class="col-md-6"><label class="form-label" for="phone">Phone</label><input class="form-control" type="text" id="phone" value="" placeholder=""></div><div class="col-md-12"><label class="form-label" for="address">Address</label><textarea class="form-control" id="address" rows="3" placeholder=""></textarea></div><div class="col-md-6"><label class="form-label" for="receipt-footer">Receipt footer</label><input class="form-control" type="text" id="receipt-footer" value="Thank you for dining with us" placeholder=""></div></div></div></div><div class="card-x mb-3"><div class="card-h">Tax and service charge</div><div class="card-b"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="vat-rate-(%)">VAT rate (%)</label><input class="form-control" type="number" id="vat-rate-(%)" value="5" placeholder=""><div class="form-text">Sample value. Confirm the applicable rate with your accountant or NBR.</div></div><div class="col-md-6"><label class="form-label" for="menu-prices">Menu prices</label><select class="form-select" id="menu-prices"><option>Include VAT</option><option>Exclude VAT</option></select></div><div class="col-md-6"><label class="form-label" for="vat-scheme">VAT scheme</label><select class="form-select" id="vat-scheme"><option>Truncated (no input credit)</option><option>Standard (input credit)</option></select></div><div class="col-md-6"><label class="form-label" for="service-charge-(%)">Service charge (%)</label><input class="form-control" type="number" id="service-charge-(%)" value="0" placeholder=""><div class="form-text">Off by default.</div></div><div class="col-md-12"><label class="form-label" for="service-charge-treatment">Service charge treatment</label><select class="form-select" id="service-charge-treatment"><option>Retained by the business</option><option>Collected for staff distribution</option></select></div></div></div></div><div class="card-x mb-3"><div class="card-h">Payment methods</div><div class="card-b"><div class="row g-3"><div class="col-md-4"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="cash" checked><label class="form-check-label" for="cash">Cash</label></div></div><div class="col-md-4"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="card" checked><label class="form-check-label" for="card">Card</label></div></div><div class="col-md-4"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="mobile-payment" checked><label class="form-check-label" for="mobile-payment">Mobile payment</label></div></div></div></div></div><div class="card-x mb-3"><div class="card-h">Limits and policies</div><div class="card-b"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="cashier-discount-limit-(%)">Cashier discount limit (%)</label><input class="form-control" type="number" id="cashier-discount-limit-(%)" value="5" placeholder=""></div><div class="col-md-6"><label class="form-label" for="cashier-refund-limit-(bdt)">Cashier refund limit (BDT)</label><input class="form-control" type="number" id="cashier-refund-limit-(bdt)" value="1000" placeholder=""></div><div class="col-md-6"><label class="form-label" for="manager-discount-limit-(%)">Manager discount limit (%)</label><input class="form-control" type="number" id="manager-discount-limit-(%)" value="15" placeholder=""></div><div class="col-md-6"><label class="form-label" for="manager-refund-limit-(bdt)">Manager refund limit (BDT)</label><input class="form-control" type="number" id="manager-refund-limit-(bdt)" value="5000" placeholder=""></div><div class="col-md-6"><label class="form-label" for="return-window">Return window</label><select class="form-select" id="return-window"><option>Same business day</option><option>24 hours</option><option>3 days</option></select></div><div class="col-md-6"><label class="form-label" for="damage-approval-above-(bdt)">Damage approval above (BDT)</label><input class="form-control" type="number" id="damage-approval-above-(bdt)" value="1000" placeholder=""></div><div class="col-md-12"><label class="form-label" for="negative-stock">Negative stock</label><select class="form-select" id="negative-stock"><option>Not allowed</option><option>Allowed with manager approval</option></select></div></div></div></div><div class="d-flex gap-2 justify-content-end mb-3"><a class="btn btn-light border" href="#">Cancel</a><button class="btn btn-accent">Save settings</button></div>
</main><div id="app-footer"></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/theme.js"></script><script src="../assets/js/pages.js"></script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add supplier · Restaurant POS</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet"></head>
<body data-page="suppliers/index.html" data-root="../">
<div id="app-sidebar"></div><div class="main"><div id="app-topbar"></div>
<main class="content">
<div class="page-head"><div><h1>Add supplier</h1><nav aria-label="breadcrumb"><ol class="breadcrumb small mb-0"><li class="breadcrumb-item">Purchasing</li><li class="breadcrumb-item active">Add supplier</li></ol></nav></div><div class="d-flex flex-wrap gap-2"></div></div>
<div class="card-x mb-3"><div class="card-h">Supplier details</div><div class="card-b"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="name">Name</label><input class="form-control" type="text" id="name" value="" placeholder=""></div><div class="col-md-6"><label class="form-label" for="contact-person">Contact person</label><input class="form-control" type="text" id="contact-person" value="" placeholder=""></div><div class="col-md-6"><label class="form-label" for="phone">Phone</label><input class="form-control" type="text" id="phone" value="" placeholder=""></div><div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" type="email" id="email" value="" placeholder=""></div><div class="col-md-6"><label class="form-label" for="supplies">Supplies</label><select class="form-select" id="supplies"><option>Meat</option><option>Dairy</option><option>Bakery</option><option>Produce</option><option>Beverages</option><option>Other</option></select></div><div class="col-md-6"><label class="form-label" for="payment-terms">Payment terms</label><select class="form-select" id="payment-terms"><option>Cash on receipt</option><option>7 days</option><option>15 days</option><option>30 days</option></select></div><div class="col-md-12"><label class="form-label" for="address">Address</label><textarea class="form-control" id="address" rows="3" placeholder=""></textarea></div></div></div></div><div class="d-flex gap-2 justify-content-end mb-3"><a class="btn btn-light border" href="#">Cancel</a><button class="btn btn-accent">Save supplier</button></div>
</main><div id="app-footer"></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/theme.js"></script><script src="../assets/js/pages.js"></script></body></html>

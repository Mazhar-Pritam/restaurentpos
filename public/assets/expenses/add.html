<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add expense · Restaurant POS</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet"></head>
<body data-page="expenses/index.html" data-root="../">
<div id="app-sidebar"></div><div class="main"><div id="app-topbar"></div>
<main class="content">
<div class="page-head"><div><h1>Add expense</h1><nav aria-label="breadcrumb"><ol class="breadcrumb small mb-0"><li class="breadcrumb-item">Money</li><li class="breadcrumb-item active">Add expense</li></ol></nav></div><div class="d-flex flex-wrap gap-2"></div></div>
<div class="card-x mb-3"><div class="card-h">Expense details</div><div class="card-b"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="date">Date</label><input class="form-control" type="date" id="date" value="" placeholder=""></div><div class="col-md-6"><label class="form-label" for="category">Category</label><select class="form-select" id="category"><option>Rent</option><option>Salaries</option><option>Utilities</option><option>Marketing</option><option>Maintenance</option><option>Other</option></select></div><div class="col-md-6"><label class="form-label" for="amount-(bdt)">Amount (BDT)</label><input class="form-control" type="number" id="amount-(bdt)" value="" placeholder=""></div><div class="col-md-6"><label class="form-label" for="paid-via">Paid via</label><select class="form-select" id="paid-via"><option>Cash</option><option>Bank</option><option>Mobile</option><option>Card</option></select></div><div class="col-md-6"><label class="form-label" for="reference">Reference</label><input class="form-control" type="text" id="reference" value="" placeholder=""></div><div class="col-md-6"><label class="form-label" for="receipt">Receipt</label><input class="form-control" type="file" id="receipt" value="" placeholder=""></div><div class="col-md-12"><label class="form-label" for="notes">Notes</label><textarea class="form-control" id="notes" rows="3" placeholder=""></textarea><div class="form-text">Ingredient purchases belong in Purchases, not here.</div></div></div></div></div><div class="d-flex gap-2 justify-content-end mb-3"><a class="btn btn-light border" href="#">Cancel</a><button class="btn btn-accent">Save expense</button></div>
</main><div id="app-footer"></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/theme.js"></script><script src="../assets/js/pages.js"></script></body></html>

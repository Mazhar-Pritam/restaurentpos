<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add menu item · Restaurant POS</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../assets/css/theme.css" rel="stylesheet"></head>
<body data-page="menu/index.html" data-root="../">
<div id="app-sidebar"></div><div class="main"><div id="app-topbar"></div>
<main class="content">
<div class="page-head"><div><h1>Add menu item</h1><nav aria-label="breadcrumb"><ol class="breadcrumb small mb-0"><li class="breadcrumb-item">Menu</li><li class="breadcrumb-item active">Add menu item</li></ol></nav></div><div class="d-flex flex-wrap gap-2"></div></div>
<div class="card-x mb-3"><div class="card-h">Item details</div><div class="card-b"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="name">Name</label><input class="form-control" type="text" id="name" value="" placeholder=""></div><div class="col-md-6"><label class="form-label" for="sku-(optional)">SKU (optional)</label><input class="form-control" type="text" id="sku-(optional)" value="" placeholder=""></div><div class="col-md-6"><label class="form-label" for="category">Category</label><select class="form-select" id="category"><option>Burgers</option><option>Pizza</option><option>Drinks</option><option>Desserts</option></select></div><div class="col-md-6"><label class="form-label" for="price-(bdt)">Price (BDT)</label><input class="form-control" type="number" id="price-(bdt)" value="" placeholder=""><div class="form-text">Menu prices include VAT by default.</div></div><div class="col-md-6"><label class="form-label" for="stock-mode">Stock mode</label><select class="form-select" id="stock-mode"><option>Recipe-based (burger, pizza)</option><option>Direct stock (bottled water)</option><option>Non-stock (service fee)</option></select><div class="form-text">Recipe-based items deduct ingredients when cooking starts.</div></div><div class="col-md-6"><label class="form-label" for="photo">Photo</label><input class="form-control" type="file" id="photo" value="" placeholder=""></div><div class="col-md-12"><label class="form-label" for="description">Description</label><textarea class="form-control" id="description" rows="3" placeholder=""></textarea></div><div class="col-md-3"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="available" checked><label class="form-check-label" for="available">Available</label></div></div><div class="col-md-3"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="shown-on-menu" checked><label class="form-check-label" for="shown-on-menu">Shown on menu</label></div></div></div></div></div><div class="d-flex gap-2 justify-content-end mb-3"><a class="btn btn-light border" href="#">Cancel</a><button class="btn btn-accent">Save item</button></div>
</main><div id="app-footer"></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/theme.js"></script><script src="../assets/js/pages.js"></script></body></html>
